# End-to-end tests (Sprint 4). A SEPARATE stack: its own project name, database volume and network,
# so the dev data in docker-compose.yml is never touched. No host ports are opened.
#
#   docker compose -f docker-compose.e2e.yml run --rm e2e        # run the whole suite
#   docker compose -f docker-compose.e2e.yml down -v             # remove the e2e stack and data
#
# The database is wiped and re-seeded (seed_demo) every time the backend starts.
# Screenshots, receipt PDFs and failure traces land in frontend/e2e/artifacts/.
name: drip-e2e

services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: drip, POSTGRES_USER: drip, POSTGRES_PASSWORD: drip }
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drip -d drip"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    working_dir: /app
    volumes: [./backend:/app]
    command: >
      sh -c "python manage.py createcachetable && python manage.py migrate --noinput &&
             python manage.py flush --noinput && python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: e2e-only-insecure-key
      DATABASE_URL: postgres://drip:drip@db:5432/drip
      EXTRA_ALLOWED_HOSTS: frontend
      EXTRA_CSRF_TRUSTED_ORIGINS: http://frontend:5173
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - e2e_frontend_modules:/app/node_modules
    environment:
      VITE_API_TARGET: http://backend:8000
      VITE_ALLOWED_HOSTS: frontend
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 100
      start_period: 20s

  e2e:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    working_dir: /app
    volumes:
      - ./frontend:/app
      - e2e_runner_modules:/app/node_modules
    environment:
      E2E_BASE_URL: http://frontend:5173
      CI: ${CI:-}
    depends_on:
      frontend: { condition: service_healthy }
    # Files written into the bind mount are handed back to the host user at the end.
    command: >
      sh -c "npm ci --no-audit --no-fund && npx playwright test -c e2e/playwright.config.ts;
             s=$$?; chown -R ${UID:-1000}:${GID:-1000} e2e/artifacts e2e/.auth 2>/dev/null; exit $$s"

volumes:
  e2e_frontend_modules:
  e2e_runner_modules:
