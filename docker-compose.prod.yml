# Production stack: Postgres, Django (gunicorn), Caddy (HTTPS + the React app) and a daily backup.
# Everything comes from `.env` (copy `.env.prod.example`). Start / update:
#   docker compose -f docker-compose.prod.yml up -d --build --wait
# First time on a new server: ops/first-run.sh. Operations guide: docs/OPERATIONS.md.
name: drip

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: drip
      POSTGRES_USER: drip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: only the other services of this stack can reach the database.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drip -d drip"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      args: { DEV_EXTRAS: "false" }
    restart: unless-stopped
    logging: *logging
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    command: >
      sh -c "python manage.py createcachetable && python manage.py migrate --noinput &&
             exec gunicorn config.wsgi --bind 0.0.0.0:8000 --workers $${GUNICORN_WORKERS:-3}
             --timeout 30 --access-logfile -"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      HOME: /tmp  # gunicorn keeps a small control socket in $HOME; the image is read-only
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      DATABASE_URL: postgres://drip:${POSTGRES_PASSWORD}@db:5432/drip
      ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env}
      CSRF_TRUSTED_ORIGINS: https://${DOMAIN}
      NUM_PROXIES: "1"
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      SECURE_HSTS_SECONDS: ${HSTS_SECONDS:-86400}
      SECURE_HSTS_INCLUDE_SUBDOMAINS: ${HSTS_INCLUDE_SUBDOMAINS:-false}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      # Plain http inside the network, with the real Host header (ALLOWED_HOSTS is strict).
      test: ["CMD", "python", "-c", "import os, urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/v1/health', headers={'Host': os.environ['ALLOWED_HOSTS'].split(',')[0]}))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: ops/caddy/Dockerfile
    restart: unless-stopped
    logging: *logging
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-${DOMAIN}}
      CADDY_AUTO_HTTPS: ${CADDY_AUTO_HTTPS:-ignore_loaded_certs}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-127.0.0.1/32}
      HSTS_SECONDS: ${HSTS_SECONDS:-86400}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data     # certificates: keep this volume, or Let's Encrypt limits are hit
      - caddy_config:/config
    depends_on:
      backend: { condition: service_healthy }

  backup:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    entrypoint: ["/bin/sh", "/ops/backup.sh"]
    environment:
      TZ: ${TZ:-Africa/Cairo}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./ops/backup:/ops:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
