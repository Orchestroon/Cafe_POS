# Dev stack. `docker compose up` starts everything: Postgres, Django (auto-migrates) and the Vite frontend.
# App: http://localhost:5173 (override FRONTEND_PORT). API: 127.0.0.1:${BACKEND_PORT:-8000}.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: drip
      POSTGRES_USER: drip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-drip}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drip -d drip"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    user: "${UID:-1000}:${GID:-1000}"
    command: sh -c "python manage.py createcachetable && python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-key}
      DATABASE_URL: postgres://drip:${POSTGRES_PASSWORD:-drip}@db:5432/drip
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
