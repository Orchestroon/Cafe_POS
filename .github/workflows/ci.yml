name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: drip, POSTGRES_USER: drip, POSTGRES_PASSWORD: drip }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drip" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-key
      DATABASE_URL: postgres://drip:drip@localhost:5432/drip
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py makemigrations --check --dry-run
        env: { DJANGO_SETTINGS_MODULE: config.settings.test }
      - run: pytest
      - run: python manage.py spectacular --validate --fail-on-warn --file /dev/null
        env: { DJANGO_SETTINGS_MODULE: config.settings.test }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build

  # Sprint 4: Playwright end-to-end flows on the isolated e2e stack (docker-compose.e2e.yml).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.e2e.yml run --rm e2e
        env: { CI: "1" }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: frontend/e2e/artifacts
          retention-days: 14
      - if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
