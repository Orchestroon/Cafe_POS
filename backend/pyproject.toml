[project]
name = "drip-cafe-pos-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "django~=5.2",
  "djangorestframework>=3.15",
  "django-environ>=0.11",
  "django-filter>=24.3",
  "drf-spectacular>=0.27",
  "psycopg[binary]>=3.2",
  "gunicorn>=22",
  "tzdata",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-django>=4.8",
  "pytest-cov>=5",
  "factory_boy>=3.3",
  "ruff>=0.6",
]

# Dependencies only: the code runs from source, nothing to package.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["DJ008"]  # no Django admin, __str__ not needed

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--ds=config.settings.test -q --tb=short --cov=apps --cov-report=term:skip-covered"
